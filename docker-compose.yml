services:
  postgres:
    image: postgres:16
    container_name: quitai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quitai
      POSTGRES_PASSWORD: quitai123
      POSTGRES_DB: quitai
    ports:
      - "5434:5432"
    volumes:
      - quitai_postgres_data:/var/lib/postgresql/data

volumes:
  quitai_postgres_data: