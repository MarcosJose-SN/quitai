services:
  postgres:
    image: postgres:16
    container_name: quitai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quitai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: quitai
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - quitai_postgres_data:/var/lib/postgresql/data

volumes:
  quitai_postgres_data: